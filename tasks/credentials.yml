---

- name: create databases
  ansible.mysql.mysql_db:
    login_unix_socket: /run/mysqld/mysqld.sock
    name: "{{ item }}"
    collation: "{{ percona_db_collation }}"
    state: present
  loop: "{{ percona_databases | default([]) | flatten(1, skip_nulls=false) }}"

- name: Manage Percona users and grants
  ansible.mysql.mysql_user:
    login_unix_socket: /run/mysqld/mysqld.sock
    name: "{{ item.name }}"
    password: "{{ percona_account_password if percona_account_plugin == 'mysql_native_password' else omit }}"
    plugin: "{{ 'caching_sha2_password' if percona_account_plugin == 'caching_sha2_password' else omit }}"
    plugin_auth_string: "{{ percona_account_password if percona_account_plugin == 'caching_sha2_password' else omit }}"
    salt: "{{ ([inventory_hostname, item.name, item.host] | to_json | hash('sha256'))[:20] if percona_account_plugin == 'caching_sha2_password' else omit }}"
    host: "{{ item.host }}"
    priv: "{{ item.database }}.*:ALL"
    state: present
  vars:
    percona_existing_account_plugin: >-
      {{ percona_account_plugins.query_result[0]
      | selectattr('name', 'equalto', item.name)
      | selectattr('host', 'equalto', item.host | lower)
      | map(attribute='plugin') | first | default('caching_sha2_password') }}
    percona_account_plugin: "{{ item.auth_plugin | default(percona_existing_account_plugin) }}"
    percona_account_password: >-
      {{ item.password if item.password is defined else
      lookup('ansible.builtin.password', percona_local_passdb ~ '/' ~ inventory_hostname ~ '/percona.' ~ item.name,
      chars=percona_pass_complexity, length=percona_pass_len) }}
  loop: "{{ percona_managed_users }}"
  no_log: true
