---

- name: remove obsolete mysqld config
  ansible.builtin.file:
    path: /etc/mysql/conf.d/mysqld.cnf
    state: absent
  notify:
   - restart mysql

- name: percona debconf settings
  ansible.builtin.debconf:
    name: "percona-server-server"
    question: "{{ item.question }}"
    value: "{{ percona_root_password }}"
    vtype: "password"
  loop:
    - { question: 'percona-server-server/root-pass' }
    - { question: 'percona-server-server/re-root-pass' }
  when: "'percona-server-server installed' not in percona_packages.stdout_lines"
  no_log: true

- name: percona is installed
  ansible.builtin.apt:
    pkg:
     - "percona-server-server"
     - "percona-server-client"
    state: present
  environment:
    PERCONA_TELEMETRY_DISABLE: "1"

- name: percona is running
  ansible.builtin.service:
    name: mysql
    state: started
    enabled: yes

- name: percona-telemetry-agent is stopped and disabled
  ansible.builtin.service:
    name: percona-telemetry-agent
    state: stopped
    enabled: no

- name: ensure config is present
  ansible.builtin.copy:
    src: "{{ item }}.cnf"
    dest: "/etc/mysql/conf.d/{{ item }}.cnf"
  loop:
    - binlog
    - client
    - mysqldump
  notify:
    - restart mysql
